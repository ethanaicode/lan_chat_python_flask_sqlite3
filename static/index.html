<!DOCTYPE html>
<html lang="zh">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内网极简聊天室</title>
  <style>
    body {
      font: 16px/1.4 system-ui, sans-serif;
      max-width: 760px;
      margin: 24px auto;
      padding: 0 12px;
    }
    #log {
      height: 60vh;
      border: 1px solid #ddd;
      padding: 8px;
      margin-top: 8px;
      overflow-y: auto;
      background: #fafafa;
    }
    .disclaimer {
      color: #888;
    }
    .sys {
      color: #888;
    }
    .msg {
      margin: 6px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    input#room {
      margin-right: 24px;
    }
    input,
    button {
      padding: 8px;
    }
    input[type="text"] {
      flex: 1;
    }
  </style>

  <div>
    <h1>内网聊天室</h1>
    <p>
      <span class="disclaimer"
        >第一次进入房间，请设置下用户名并点击保存，以方便识别身份</span
      >
    </p>
    <div>
      房间：
      <input id="room" value="general" />
      用户名：
      <input id="user" placeholder="你的名字" />
      <button id="save">保存</button>
    </div>

    <div id="log" aria-live="polite"></div>

    <form id="sendForm">
      <input
        id="content"
        type="text"
        placeholder="说点什么…"
        autocomplete="off"
      />
      <button type="submit">发送</button>
    </form>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const log = $("#log");
    const userInput = $("#user");
    const roomInput = $("#room");
    const contentInput = $("#content");
    const saveBtn = $("#save");
    const form = $("#sendForm");

    // 记住用户名/房间
    userInput.value =
      localStorage.getItem("chat_user") ||
      "user" + Math.floor(Math.random() * 1000);
    roomInput.value = localStorage.getItem("chat_room") || "general";

    function addLine(text, cls = "msg") {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = text; // 用 textContent 防 XSS
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function fmt(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString();
    }

    let sinceId = 0;
    async function loadRecent() {
      const room = encodeURIComponent(roomInput.value.trim() || "general");
      const r = await fetch(`/api/recent?room=${room}&limit=100`);
      const data = await r.json();
      log.innerHTML = "";
      data.forEach((m) => addLine(`[${fmt(m.ts)}] ${m.user}: ${m.content}`));
      sinceId = data.length ? data[data.length - 1].id : 0;
      addLine(`—— 进入房间 #${roomInput.value} ——`, "sys");
    }

    async function poll() {
      const room = encodeURIComponent(roomInput.value.trim() || "general");
      try {
        const r = await fetch(
          `/api/messages?room=${room}&since_id=${sinceId}&limit=200`
        );
        const data = await r.json();
        data.forEach((m) => {
          addLine(`[${fmt(m.ts)}] ${m.user}: ${m.content}`);
          sinceId = m.id;
        });
      } catch (_) {}
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = userInput.value.trim() || "anon";
      const room = roomInput.value.trim() || "general";
      const content = contentInput.value.trim();
      if (!content) return;
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, room, content }),
      });
      contentInput.value = "";
      // 立即拉一次，感觉更“即时”
      poll();
    });

    saveBtn.addEventListener("click", () => {
      localStorage.setItem("chat_user", userInput.value.trim());
      localStorage.setItem("chat_room", roomInput.value.trim());
      loadRecent();
    });

    // 初始化
    loadRecent().then(() => setInterval(poll, 1500));
  </script>
</html>
