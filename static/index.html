<!DOCTYPE html>
<html lang="zh">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内网极简聊天室</title>
  <style>
    body {
      font: 16px/1.4 system-ui, sans-serif;
      max-width: 760px;
      margin: 24px auto;
      padding: 0 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 26px;
    }
    .admin-actions {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .admin-actions button {
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .admin-actions button:hover {
      background: #f3f4f6;
    }
    .admin-actions .danger {
      border-color: #ef4444;
      color: #b91c1c;
    }
    #log {
      height: 60vh;
      border: 1px solid #ddd;
      padding: 8px;
      margin-top: 8px;
      overflow-y: auto;
      background: #fafafa;
    }
    .disclaimer {
      color: #888;
    }

    /* 聊天行基础样式 */
    .sys {
      color: #888;
    }
    .msg {
      margin: 6px 0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* 时间：灰、等宽字体 */
    .msg .time {
      color: #9ca3af;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-right: 4px;
    }
    /* 用户名：蓝色、加粗 */
    .msg .user {
      color: #2563eb;
      font-weight: 600;
      margin-right: 4px;
    }
    /* 正文：继承文本色即可 */
    .msg .text {
      color: #222222;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px 12px;
    }

    input,
    button {
      padding: 8px;
    }
    input[type="text"] {
      flex: 1;
    }

    /* 屏宽 ≤ 720px：改为两排 */
    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
      }
      .topbar h1 {
        font-size: 22px;
      }
      .admin-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .controls {
        display: grid;
        grid-template-columns: auto 1fr auto; /* 左：标签 | 中：输入 | 右：按钮 */
        align-items: center;
        gap: 8px 12px;
      }

      /* 第1排：房间 */
      .controls label[for="room"] {
        grid-column: 1;
        grid-row: 1;
        white-space: nowrap;
      }
      .controls #room {
        grid-column: 2;
        grid-row: 1;
      }

      /* 第2排：用户名 + 右侧的保存按钮 */
      .controls label[for="user"] {
        grid-column: 1;
        grid-row: 2;
        white-space: nowrap;
      }
      .controls #user {
        grid-column: 2;
        grid-row: 2;
      }
      .controls #save {
        grid-column: 3;
        grid-row: 2;
        justify-self: start;
      }
    }
  </style>

  <div>
    <div class="topbar">
      <h1>内网聊天室</h1>
      <div class="admin-actions" id="adminActions">
        <button id="purgeRoomBtn" title="删除当前房间全部消息">删当前房间</button>
        <button class="danger" id="purgeAllBtn" title="删除所有房间消息">
          删全部
        </button>
      </div>
    </div>
    <p>
      <span class="disclaimer"
        >第一次进入房间，请设置下用户名并点击保存，以方便识别身份</span
      >
    </p>
    <div class="controls">
      <label for="room">房间：</label>
      <input id="room" value="general" />
      <label for="user">用户名：</label>
      <input id="user" placeholder="你的名字" />
      <button id="save">保存</button>
    </div>

    <div id="log" aria-live="polite"></div>

    <form id="sendForm">
      <input
        id="content"
        type="text"
        placeholder="说点什么…"
        autocomplete="off"
      />
      <button type="submit">发送</button>
    </form>
  </div>

  <script>
    // 控制开关：可以在页面启动时由后端渲染出来，或者通过 URL 参数传入
    const SAFE_MODE = true; // true = 安全模式；false = 自由模式

    const $ = (sel) => document.querySelector(sel);
    const log = $("#log");
    const userInput = $("#user");
    const roomInput = $("#room");
    const contentInput = $("#content");
    const saveBtn = $("#save");
    const form = $("#sendForm");
    const adminActions = $("#adminActions");
    const purgeRoomBtn = $("#purgeRoomBtn");
    const purgeAllBtn = $("#purgeAllBtn");

    // 记住用户名/房间
    userInput.value =
      localStorage.getItem("chat_user") ||
      "user" + Math.floor(Math.random() * 1000);
    roomInput.value = localStorage.getItem("chat_room") || "general";

    function getAdminHeaders() {
      const token = localStorage.getItem("chat_admin_token") || "";
      return token ? { "X-Admin-Token": token } : {};
    }

    async function refreshAdminStatus() {
      try {
        const r = await fetch("/api/admin/status", {
          headers: getAdminHeaders(),
        });
        if (!r.ok) return;
        const data = await r.json();
        adminActions.style.display = data.is_admin ? "flex" : "none";
      } catch (_) {
        adminActions.style.display = "none";
      }
    }

    async function purgeMessages(target) {
      const room = roomInput.value.trim() || "general";
      const isAll = target === "ALL";
      const confirmText = isAll
        ? "确认删除全部房间的所有聊天记录？此操作不可恢复。"
        : `确认删除房间 #${room} 的所有聊天记录？此操作不可恢复。`;
      if (!window.confirm(confirmText)) return;

      const payload = isAll ? {} : { room };
      const r = await fetch("/api/admin/purge", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...getAdminHeaders(),
        },
        body: JSON.stringify(payload),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) {
        alert("操作失败：你当前不是管理员，或权限校验未通过。");
        await refreshAdminStatus();
        return;
      }
      await loadRecent();
      addLine(`管理员已删除 ${data.deleted || 0} 条消息（${data.room}）`, "sys");
    }

    function renderMessageContent(el, raw) {
      if (SAFE_MODE) {
        // 严格安全，只显示纯文本
        el.textContent = raw;
      } else {
        // 自由模式：允许 HTML
        el.innerHTML = raw;
      }
    }

    function addMessage(m) {
      const row = document.createElement("div");
      row.className = "msg";

      const t = document.createElement("span");
      t.className = "time";
      t.textContent = `[${fmt(m.ts)}]`;

      const u = document.createElement("span");
      u.className = "user";
      u.textContent = `${m.user}:`;

      const c = document.createElement("span");
      c.className = "text";
      renderMessageContent(c, m.content);

      row.append(t, u, c);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    // 仍保留 addLine 用于系统提示行（cls = "sys"）
    function addLine(text, cls = "msg") {
      const div = document.createElement("div");
      div.className = cls;
      div.innerHTML = text; // 允许 HTML
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function fmt(ts) {
      const d = new Date(ts * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(
        d.getSeconds()
      )}`;
    }

    let sinceId = 0;
    async function loadRecent() {
      const room = encodeURIComponent(roomInput.value.trim() || "general");
      const r = await fetch(`/api/recent?room=${room}&limit=100`);
      const data = await r.json();
      log.innerHTML = "";
      data.forEach((m) => addMessage(m));
      sinceId = data.length ? data[data.length - 1].id : 0;
      addLine(`———— 欢迎进入房间 #${roomInput.value} ————`, "sys");
    }

    async function poll() {
      const room = encodeURIComponent(roomInput.value.trim() || "general");
      try {
        const r = await fetch(
          `/api/messages?room=${room}&since_id=${sinceId}&limit=200`
        );
        const data = await r.json();
        data.forEach((m) => {
          addMessage(m);
          sinceId = m.id;
        });
      } catch (_) {}
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = userInput.value.trim() || "anon";
      const room = roomInput.value.trim() || "general";
      const content = contentInput.value.trim();
      if (!content) return;
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, room, content }),
      });
      contentInput.value = "";
      // 立即拉一次，感觉更“即时”
      poll();
    });

    saveBtn.addEventListener("click", () => {
      localStorage.setItem("chat_user", userInput.value.trim());
      localStorage.setItem("chat_room", roomInput.value.trim());
      loadRecent();
    });

    purgeRoomBtn.addEventListener("click", () => purgeMessages("ROOM"));
    purgeAllBtn.addEventListener("click", () => purgeMessages("ALL"));

    // 初始化
    Promise.all([loadRecent(), refreshAdminStatus()]).then(() =>
      setInterval(poll, 1500)
    );
  </script>
</html>
