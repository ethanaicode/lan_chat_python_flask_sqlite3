<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内网聊天室</title>
    <link rel="stylesheet" href="/static/chat-theme.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="topbar">
          <h2>内网聊天室</h2>
          <div class="admin-actions" id="adminActions">
            <button class="ghost" id="purgeRoomBtn" title="删除当前房间全部消息">
              删当前房间
            </button>
            <button class="danger" id="purgeAllBtn" title="删除所有房间消息">
              删全部
            </button>
          </div>
        </div>
        <p>
          支持局域网快速沟通。首次进入请设置用户名，系统会记住你的最近房间与昵称。
        </p>
        <div class="controls">
          <div class="control-group room-group">
            <label for="room">房间：</label>
            <input id="room" type="text" value="general" />
            <button class="ghost" id="switchRoom" type="button">切换房间</button>
            <button
              class="ghost icon-btn"
              id="goGeneral"
              type="button"
              title="回主房间"
              aria-label="回主房间"
            >
              <svg
                viewBox="0 0 1024 1024"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M991.36 411.52l-448-384a48.448 48.448 0 0 0-62.72 0l-448 384c-19.84 17.28-22.4 47.36-5.12 67.84C40.96 494.72 62.08 499.84 80 492.8V864c0 79.36 64.64 144 144 144h576c79.36 0 144-64.64 144-144V493.44a48.768 48.768 0 0 0 52.48-14.08c17.28-19.84 14.72-50.56-5.12-67.84zM560 912h-96V672c0-26.24 21.76-48 48-48s48 21.76 48 48v240z m240 0H656V672c0-79.36-64.64-144-144-144s-144 64.64-144 144v240H224c-26.24 0-48-21.76-48-48V415.36l336-288 336 288V864c0 26.24-21.76 48-48 48z"
                ></path>
              </svg>
            </button>
          </div>
          <div class="control-group">
            <label for="user">用户名：</label>
            <input id="user" type="text" placeholder="你的名字" />
            <button class="ghost" id="saveUser" type="button">保存</button>
          </div>
        </div>
      </section>

      <section class="chat-panel">
        <div class="panel-head">
          <h3>聊天消息</h3>
          <span class="hint">自动轮询中（1.5 秒）</span>
        </div>

        <div id="log" aria-live="polite"></div>

        <form id="sendForm">
          <input
            id="content"
            type="text"
            placeholder="说点什么..."
            autocomplete="off"
          />
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script>
    // 控制开关：可以在页面启动时由后端渲染出来，或者通过 URL 参数传入
    const SAFE_MODE = true; // true = 安全模式；false = 自由模式

    const $ = (sel) => document.querySelector(sel);
    const log = $("#log");
    const userInput = $("#user");
    const roomInput = $("#room");
    const contentInput = $("#content");
    const switchRoomBtn = $("#switchRoom");
    const goGeneralBtn = $("#goGeneral");
    const saveUserBtn = $("#saveUser");
    const form = $("#sendForm");
    const adminActions = $("#adminActions");
    const purgeRoomBtn = $("#purgeRoomBtn");
    const purgeAllBtn = $("#purgeAllBtn");
    const INITIAL_ROOM = {{ initial_room|tojson }};

    const USER_COLOR_PALETTE = [
      "#155e75", // cyan-800
      "#1d4ed8", // blue-700
      "#7c3aed", // violet-600
      "#be185d", // pink-700
      "#b45309", // amber-700
      "#0f766e", // teal-700
      "#166534", // green-800
      "#9f1239", // rose-800
      "#374151", // gray-700
      "#4338ca", // indigo-700
    ];

    let userColorMap = {};
    let nextUserColorIndex = 0;

    let activeUser =
      localStorage.getItem("chat_user") ||
      "user" + Math.floor(Math.random() * 1000);
    let activeRoom = INITIAL_ROOM || "general";

    // 输入框允许先改，但只有点击“保存”才会成为当前生效值。
    userInput.value = activeUser;
    roomInput.value = activeRoom;

    function updateRoomUrl(room) {
      if (!room || room === "general") {
        window.history.replaceState({}, "", "/");
        return;
      }
      window.history.replaceState(
        {},
        "",
        "/" + encodeURIComponent(room)
      );
    }

    const GLOBAL_COLOR_STATE_KEY = "chat_user_color_state_global";

    function loadColorState() {
      try {
        const raw = localStorage.getItem(GLOBAL_COLOR_STATE_KEY);
        if (!raw) return { map: {}, next: 0 };
        const parsed = JSON.parse(raw);
        const map = parsed && typeof parsed.map === "object" ? parsed.map : {};
        const next = Number.isInteger(parsed?.next) ? parsed.next : 0;
        return { map, next: Math.max(0, next) };
      } catch (_) {
        return { map: {}, next: 0 };
      }
    }

    function saveColorState() {
      localStorage.setItem(
        GLOBAL_COLOR_STATE_KEY,
        JSON.stringify({ map: userColorMap, next: nextUserColorIndex })
      );
    }

    function ensureColorState() {
      const state = loadColorState();
      userColorMap = state.map;
      nextUserColorIndex = state.next;
    }

    function colorForUser(user) {
      const name = (user || "anon").trim() || "anon";
      if (!Object.prototype.hasOwnProperty.call(userColorMap, name)) {
        const idx = nextUserColorIndex % USER_COLOR_PALETTE.length;
        userColorMap[name] = idx;
        nextUserColorIndex += 1;
        saveColorState();
      }
      return USER_COLOR_PALETTE[userColorMap[name] % USER_COLOR_PALETTE.length];
    }

    function applyRoomSwitch() {
      activeRoom = roomInput.value.trim() || "general";
      updateRoomUrl(activeRoom);
      loadRecent();
    }

    function goGeneralRoom() {
      roomInput.value = "general";
      applyRoomSwitch();
    }

    function applyUserSave() {
      activeUser = userInput.value.trim() || "anon";
      localStorage.setItem("chat_user", activeUser);
      addLine(`已保存用户名：${activeUser}`, "sys");
    }

    function getAdminHeaders() {
      const token = localStorage.getItem("chat_admin_token") || "";
      return token ? { "X-Admin-Token": token } : {};
    }

    async function refreshAdminStatus() {
      try {
        const r = await fetch("/api/admin/status", {
          headers: getAdminHeaders(),
        });
        if (!r.ok) return;
        const data = await r.json();
        adminActions.style.display = data.is_admin ? "flex" : "none";
      } catch (_) {
        adminActions.style.display = "none";
      }
    }

    async function purgeMessages(target) {
      const room = activeRoom || "general";
      const isAll = target === "ALL";
      const confirmText = isAll
        ? "确认删除全部房间的所有聊天记录？此操作不可恢复。"
        : `确认删除房间 #${room} 的所有聊天记录？此操作不可恢复。`;
      if (!window.confirm(confirmText)) return;

      const payload = isAll ? {} : { room };
      const r = await fetch("/api/admin/purge", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...getAdminHeaders(),
        },
        body: JSON.stringify(payload),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) {
        alert("操作失败：你当前不是管理员，或权限校验未通过。");
        await refreshAdminStatus();
        return;
      }
      await loadRecent();
      addLine(`管理员已删除 ${data.deleted || 0} 条消息（${data.room}）`, "sys");
    }

    function renderMessageContent(el, raw) {
      if (SAFE_MODE) {
        // 严格安全，只显示纯文本
        el.textContent = raw;
      } else {
        // 自由模式：允许 HTML
        el.innerHTML = raw;
      }
    }

    function addMessage(m) {
      const row = document.createElement("div");
      row.className = "msg";

      const t = document.createElement("span");
      t.className = "time";
      t.textContent = `[${fmt(m.ts)}]`;

      const u = document.createElement("span");
      u.className = "user";
      u.textContent = `${m.user}:`;
      u.style.setProperty("--user-color", colorForUser(m.user));

      const c = document.createElement("span");
      c.className = "text";
      renderMessageContent(c, m.content);

      row.append(t, u, c);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    // 仍保留 addLine 用于系统提示行（cls = "sys"）
    function addLine(text, cls = "msg") {
      const div = document.createElement("div");
      div.className = cls;
      div.innerHTML = text; // 允许 HTML
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function fmt(ts) {
      const d = new Date(ts * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(
        d.getSeconds()
      )}`;
    }

    let sinceId = 0;
    async function loadRecent() {
      ensureColorState();
      const room = encodeURIComponent(activeRoom || "general");
      const r = await fetch(`/api/recent?room=${room}&limit=100`);
      const data = await r.json();
      log.innerHTML = "";
      data.forEach((m) => addMessage(m));
      sinceId = data.length ? data[data.length - 1].id : 0;
      addLine(`———— 欢迎进入房间 #${activeRoom} ————`, "sys");
    }

    async function poll() {
      const room = encodeURIComponent(activeRoom || "general");
      try {
        const r = await fetch(
          `/api/messages?room=${room}&since_id=${sinceId}&limit=200`
        );
        const data = await r.json();
        data.forEach((m) => {
          addMessage(m);
          sinceId = m.id;
        });
      } catch (_) {}
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = activeUser || "anon";
      const room = activeRoom || "general";
      const content = contentInput.value.trim();
      if (!content) return;
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, room, content }),
      });
      contentInput.value = "";
      // 立即拉一次，感觉更“即时”
      poll();
    });

    switchRoomBtn.addEventListener("click", applyRoomSwitch);
    goGeneralBtn.addEventListener("click", goGeneralRoom);
    saveUserBtn.addEventListener("click", applyUserSave);

    purgeRoomBtn.addEventListener("click", () => purgeMessages("ROOM"));
    purgeAllBtn.addEventListener("click", () => purgeMessages("ALL"));

    // 初始化
    updateRoomUrl(activeRoom);
    Promise.all([loadRecent(), refreshAdminStatus()]).then(() =>
      setInterval(poll, 1500)
    );
    </script>
  </body>
</html>
